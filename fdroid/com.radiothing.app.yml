# F-Droid build metadata for com.radiothing.app
#
# This is the recipe to submit to fdroiddata (https://gitlab.com/fdroid/fdroiddata)
# when opening the merge request that packages RadioThing. Keep it in sync with
# the app module's versionCode/versionName, and tag the matching commit as v<versionName>.
# The store listing (name, summary, description, changelogs, icon) is read
# automatically from fastlane/metadata/android/ in this repository.

