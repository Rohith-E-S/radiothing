Changelog: https://github.com/Rohith-E-S/radiothing/releases
Donate: https://github.com/sponsors/Rohith-E-S

Name: RadioThing
Summary: Dot-matrix internet radio player

RepoType: git
Repo: https://github.com/Rohith-E-S/radiothing.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
